// Phase 5 pin 0035: cookie firewall — default OFF until explicitly armed.
// Arms only under Pollution + nativePersonaHooks + enabled.
defaultPref("darkstr.cookieFirewall.enabled", false);
defaultPref("darkstr.cookieFirewall.mode", "synthetic");
defaultPref("darkstr.cookieFirewall.allowlist", "");
